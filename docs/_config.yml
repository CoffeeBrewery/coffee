title: CoffeeBrewery Documentation
description: Documentation for the package manager for everywhere.
url: https://coffee-docs.lusd1.org

exclude:
  - AGENTS.md
  - bin
  - CNAME
  - docs_rubocop_style.yml
  - Gemfile*
  - Rakefile
  - README.md
  - vale-styles
  - vendor
include:
  - _*.html
plugins:
  - jekyll-optional-front-matter
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
optional_front_matter:
  remove_originals: true

permalink: :title

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: https://coffee.lusd1.org/assets/img/coffeebrewery.png
      search_name: Documentation
      search_site: docs
  - scope:
      path: governance
    values:
      category: governance-archives

kramdown:
  toc_levels: 2..3

logo: https://coffee.lusd1.org/assets/img/coffeebrewery.png

twitter:
  username: MacCoffeeBrewery

facebook:
  publisher: https://www.facebook.com/machomebrew/
