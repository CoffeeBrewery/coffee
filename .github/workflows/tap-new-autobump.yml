# coffee tap-new uses this file to generate an autobump workflow for the new tap
name: tap-new autobump template

on:
  push:
    branches:
      - TAP_NEW_BRANCH
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # this will be changed later and randomised by coffee tap-new
    - cron: "1 1 1 1 1"

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    if: github.repository == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Set up git
        id: git_setup
        uses: CoffeeBrewery/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1

      - name: Bump formulae
        env:
          COFFEEBREWER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COFFEEBREWER_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          COFFEEBREWER_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: coffee bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"
