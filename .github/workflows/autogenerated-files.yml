name: Autogenerated files check

on:
  pull_request:
    paths:
      - .github/workflows/autogenerated-files.yml
      - README.md
      - completions/**
      - docs/Manpage.md
      - manpages/coffee.1
      - Library/CoffeeBrewery/cmd/**
      - Library/CoffeeBrewery/dev-cmd/**
      - Library/CoffeeBrewery/cli/parser.rb
      - Library/CoffeeBrewery/completions.rb
      - Library/CoffeeBrewery/env_config.rb

permissions:
  contents: read

env:
  COFFEEBREWER_DEVELOPER: 1
  COFFEEBREWER_NO_AUTO_UPDATE: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autogenerated:
    runs-on: ubuntu-latest
    if: github.repository == 'CoffeeBrewery/coffee'
    steps:
      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Cache Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Check for changes to autogenerated files
        id: check
        run: |
          if coffee generate-man-completions
          then
            echo "This PR modifies autogenerated files!" >&2
            echo "Please ensure their source files are updated and then run the following:
              coffee generate-man-completions" >&2
            exit 1
          else
            exit 0
          fi
