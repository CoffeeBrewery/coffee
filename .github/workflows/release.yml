name: Release
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/release.yml
      - Library/CoffeeBrewery/utils/macos_user.sh
      - package/**/*
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag for the release"
        required: true
        type: string
env:
  PKG_APPLE_DEVELOPER_TEAM_ID: ${{ secrets.PKG_APPLE_DEVELOPER_TEAM_ID }}
  COFFEEBREWER_NO_ANALYTICS_THIS_RUN: 1
  COFFEEBREWER_NO_ANALYTICS_MESSAGE_OUTPUT: 1

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  build:
    if: github.repository_owner == 'CoffeeBrewery' && github.actor != 'dependabot[bot]'
    runs-on: macos-26
    outputs:
      installer_path: "CoffeeBrewery-${{ steps.homebrew-version.outputs.version }}.pkg"
    env:
      TEMPORARY_CERTIFICATE_FILE: "homebrew_developer_id_installer_certificate.p12"
      TEMPORARY_KEYCHAIN_FILE: "homebrew_installer_signing.keychain-db"
      # Set to the oldest supported version of macOS
      COFFEEBREWER_MACOS_OLDEST_SUPPORTED: "15.0"
    permissions:
      contents: write # for creating tags and releases
      attestations: write # for actions/attest
      id-token: write # for actions/attest
      issues: read # for checking release blocker labels
      pull-requests: read # for checking release blocker labels
    steps:
      - name: Check for release blockers
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        # Keep in sync with the release blocker check in
        # Library/CoffeeBrewery/dev-cmd/release.rb.
        run: |
          labels=("release blocker")
          if [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.0$ ]]
          then
            labels+=("major/minor release blocker")
          fi

          blockers="$(for label in "${labels[@]}"
          do
            gh api --method GET repos/CoffeeBrewery/coffee/issues \
              --raw-field state=open --raw-field labels="${label}" \
              --jq '.[].html_url'
          done | sort -u)"

          if [[ -n "${blockers}" ]]
          then
            echo "Open issues or pull requests are blocking this release:"
            echo "${blockers}"
            exit 1
          fi

      - name: Remove existing API cache (to force update)
        run: rm -rvf ~/Library/Caches/CoffeeBrewery/api

      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Install Pandoc
        run: coffee install pandoc

      - name: Create and unlock temporary macOS keychain
        run: |
          TEMPORARY_KEYCHAIN_PASSWORD="$(openssl rand -base64 20)"
          TEMPORARY_KEYCHAIN_PATH="${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          security create-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"
          security set-keychain-settings -l -u -t 21600 "${TEMPORARY_KEYCHAIN_PATH}"
          security unlock-keychain -p "${TEMPORARY_KEYCHAIN_PASSWORD}" "${TEMPORARY_KEYCHAIN_PATH}"

      - name: Create temporary certificate file
        env:
          PKG_APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.PKG_APPLE_SIGNING_CERTIFICATE_BASE64 }}
        run: echo -n "${PKG_APPLE_SIGNING_CERTIFICATE_BASE64}" |
          base64 --decode --output="${RUNNER_TEMP}/${TEMPORARY_CERTIFICATE_FILE}"

      - name: Import certificate file into macOS keychain
        env:
          PKG_APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.PKG_APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: security import "${RUNNER_TEMP}/${TEMPORARY_CERTIFICATE_FILE}"
          -k "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          -P "${PKG_APPLE_SIGNING_CERTIFICATE_PASSWORD}"
          -t cert
          -f pkcs12
          -A

      - name: Clean up temporary certificate file
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/${TEMPORARY_CERTIFICATE_FILE}"

      - name: Checkout another CoffeeBrewery to coffee subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: coffee
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag if needed, check and get CoffeeBrewery version from Git
        id: homebrew-version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${TAG}" ]; then
            git -C coffee tag "${TAG}"
          fi

          homebrew_version=$(git -C coffee describe --tags --always)

          if [ -n "${TAG}" ] && [ "${homebrew_version}" != "${TAG}" ]; then
            echo "CoffeeBrewery version ${homebrew_version} does not match tag ${TAG}"
            exit 1
          fi

          echo "version=${homebrew_version}" >> "${GITHUB_OUTPUT}"

          # Ship a stable checkout for hosts without Git or developer tools.
          git -C coffee checkout --force -B stable

      - name: Prepare CoffeeBrewery API cache for package
        run: |
          package_api_cache="${RUNNER_TEMP}/homebrew-api-cache"
          rm -rvf ~/Library/Caches/CoffeeBrewery/api "${package_api_cache}"

          COFFEEBREWER_DEVELOPER=1 COFFEEBREWER_UPDATE_SKIP_BREW=1 coffee update --auto-update --verbose
          cp -vR ~/Library/Caches/CoffeeBrewery/api coffee/cache_api

      - name: Check installer Git commands
        run: |
          # Keep repository Git calls using the install user's wrapper.
          if grep -nE 'git .* (checkout|reset|clean)\b|git .* tag --list\b' \
            coffee/package/scripts/postinstall
          then
            echo "Installer Git repository operations must use \`git_as_user\`."
            exit 1
          fi

      - name: Open macOS keychain
        run: security list-keychain -d user -s "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"

      - name: Prepare CoffeeBrewery installer scripts
        run: |
          installer_scripts="${RUNNER_TEMP}/homebrew-installer-scripts"
          rm -rvf "${installer_scripts}"
          mkdir -vp "${installer_scripts}"
          cp -vp coffee/package/scripts/preinstall \
            coffee/package/scripts/postinstall \
            coffee/Library/CoffeeBrewery/utils/macos_user.sh \
            "${installer_scripts}/"
          echo "COFFEEBREWER_INSTALLER_SCRIPTS=${installer_scripts}" >> "${GITHUB_ENV}"

      - name: Build CoffeeBrewery installer component package
        env:
          COFFEEBREWER_VERSION: ${{ steps.homebrew-version.outputs.version }}
        # Note: `Library/CoffeeBrewery/test/support/fixtures/` contains unsigned
        # binaries so it needs to be excluded from notarization.
        run: pkgbuild --root coffee
          --scripts "${COFFEEBREWER_INSTALLER_SCRIPTS}"
          --identifier sh.coffee.homebrew
          --version "${COFFEEBREWER_VERSION}"
          --install-location /opt/homebrew
          --filter .DS_Store
          --filter "(.*)/Library/CoffeeBrewery/test/support/fixtures/"
          --min-os-version "${COFFEEBREWER_MACOS_OLDEST_SUPPORTED}"
          --sign "${PKG_APPLE_DEVELOPER_TEAM_ID}"
          CoffeeBrewery.pkg

      - name: Convert CoffeeBrewery license file to RTF
        run: (printf "### " && cat coffee/LICENSE.txt) |
          pandoc --from markdown --standalone --output coffee/package/resources/LICENSE.rtf

      - name: Build CoffeeBrewery installer product package
        env:
          COFFEEBREWER_VERSION: ${{ steps.homebrew-version.outputs.version }}
        run: productbuild --resources coffee/package/resources
          --distribution coffee/package/Distribution.xml
          --package-path CoffeeBrewery.pkg
          --sign "${PKG_APPLE_DEVELOPER_TEAM_ID}"
          "CoffeeBrewery-${COFFEEBREWER_VERSION}.pkg"

      - name: Clean up temporary macOS keychain
        if: ${{ always() }}
        run: |
          if [[ -f "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}" ]]
          then
            security delete-keychain "${RUNNER_TEMP}/${TEMPORARY_KEYCHAIN_FILE}"
          fi

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: CoffeeBrewery-${{ steps.homebrew-version.outputs.version }}.pkg

      - name: Upload installer to GitHub Actions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CoffeeBrewery-${{ steps.homebrew-version.outputs.version }}.pkg
          path: CoffeeBrewery-${{ steps.homebrew-version.outputs.version }}.pkg
  test:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - name: Download installer from GitHub Actions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build.outputs.installer_path }}"

      - name: Unset global Git safe directory setting
        run: git config --global --unset-all safe.directory

      - name: Remove existing CoffeeBrewery installations
        run: |
          sudo rm -rf coffee /opt/homebrew/{Cellar,Caskroom,CoffeeBrewery/Library/Taps}
          coffee cleanup --prune-prefix
          sudo rm -rf /opt/homebrew /home/linuxbrew

      - name: Zero existing installer logs
        run: echo | sudo tee /var/log/install.log

      - name: Install CoffeeBrewery from installer package
        env:
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: sudo installer -verbose -pkg "${INSTALLER_PATH}" -target /

      - name: Output installer logs
        if: ${{ always() }}
        run: sudo cat /var/log/install.log

      - name: Check CoffeeBrewery version matches tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          homebrew_version=$(coffee --version)
          if [ -n "${TAG}" ] && [ "${homebrew_version}" != "CoffeeBrewery ${TAG}" ]; then
            echo "CoffeeBrewery version ${homebrew_version} does not match tag ${TAG}"
            exit 1
          fi

      - run: coffee config

      - run: coffee doctor

      - name: Zero existing installer logs (again)
        run: echo | sudo tee /var/log/install.log

      - name: Reinstall CoffeeBrewery from installer package
        env:
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: sudo installer -verbose -pkg "${INSTALLER_PATH}" -target /

      - name: Output installer logs (again)
        if: ${{ always() }}
        run: sudo cat /var/log/install.log

      - run: coffee config

      - run: coffee doctor

      - name: Install CoffeeBrewery for a non-admin user
        env:
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: |
          sudo sysadminctl -addUser brewtest -password "$(uuidgen)" -shell /bin/bash
          test "$(id -gn brewtest)" = staff
          if id -Gn brewtest | grep -Eq '(^| )(admin|sudo|wheel)( |$)'
          then
            echo "The test account must not be an administrator."
            exit 1
          fi
          sudo defaults write /var/tmp/.homebrew_pkg_user COFFEEBREWER_PKG_USER brewtest
          sudo chown root:wheel /var/tmp/.homebrew_pkg_user.plist
          sudo chmod 600 /var/tmp/.homebrew_pkg_user.plist
          sudo chmod -N /var/tmp/.homebrew_pkg_user.plist
          sudo rm -rf /opt/homebrew
          sudo installer -verbose -pkg "${INSTALLER_PATH}" -target /
          sudo -i -u brewtest /usr/bin/env COFFEEBREWER_NO_SUDO=1 \
            /opt/homebrew/bin/coffee install --force-bottle hello
          sudo -i -u brewtest /opt/homebrew/bin/hello --version
          test -z "$(find /opt/homebrew ! -user brewtest -o ! -group "$(id -gn brewtest)")"

      - name: Check non-admin permissions on installation and reinstallation
        env:
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: |
          for phase in fresh reinstall
          do
            if [[ "${phase}" == reinstall ]]
            then
              sudo chmod go+w /opt/homebrew /opt/homebrew/bin /opt/homebrew/bin/coffee \
                /Users/brewtest/Library/Caches/CoffeeBrewery
              sudo installer -verbose -pkg "${INSTALLER_PATH}" -target /
            fi
            writable_paths="$(sudo find /opt/homebrew /Users/brewtest/Library/Caches/CoffeeBrewery \
              ! -type l \( -perm -0020 -o -perm -0002 \))"
            if [[ -n "${writable_paths}" ]]
            then
              printf 'Unexpected writable paths:\n%s\n' "${writable_paths}"
              exit 1
            fi
            test ! -w /opt/homebrew
            test ! -w /opt/homebrew/bin
            test ! -w /opt/homebrew/bin/coffee
          done

  upload:
    needs: [build, test]
    runs-on: macos-26
    permissions:
      # To write assets to GitHub release
      contents: write
    steps:
      - name: Checkout CoffeeBrewery/coffee
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download installer from GitHub Actions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ needs.build.outputs.installer_path }}"

      - name: Notarize CoffeeBrewery installer package
        env:
          PKG_APPLE_ID_EMAIL: ${{ secrets.PKG_APPLE_ID_EMAIL }}
          PKG_APPLE_ID_APP_SPECIFIC_PASSWORD: ${{ secrets.PKG_APPLE_ID_APP_SPECIFIC_PASSWORD }}
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: xcrun notarytool submit "${INSTALLER_PATH}"
          --team-id  "${PKG_APPLE_DEVELOPER_TEAM_ID}"
          --apple-id "${PKG_APPLE_ID_EMAIL}"
          --password "${PKG_APPLE_ID_APP_SPECIFIC_PASSWORD}"
          --wait

      - name: Create draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo CoffeeBrewery/coffee \
            --title "${TAG}" \
            --draft \
            --generate-notes \
            --fail-on-no-commits

      - name: Rename installer to unversioned path
        env:
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: mv "${INSTALLER_PATH}" CoffeeBrewery.pkg

      - name: Upload installer to GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_PATH: ${{ needs.build.outputs.installer_path }}
        run: |
          VERSION="${INSTALLER_PATH#CoffeeBrewery-}"
          VERSION="${VERSION%.pkg}"
          gh release upload --repo CoffeeBrewery/coffee "${VERSION}" CoffeeBrewery.pkg
