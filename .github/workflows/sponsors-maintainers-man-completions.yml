name: Update sponsors, maintainers, manpage and completions

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/sponsors-maintainers-man-completions.yml
      - README.md
      - Library/CoffeeBrewery/cmd/**
      - Library/CoffeeBrewery/dev-cmd/**
      - Library/CoffeeBrewery/completions/**
      - Library/CoffeeBrewery/manpages/**
      - Library/CoffeeBrewery/cli/parser.rb
      - Library/CoffeeBrewery/completions.rb
      - Library/CoffeeBrewery/env_config.rb
      - Library/CoffeeBrewery/utils/github.rb
      - Library/CoffeeBrewery/utils/sponsors.rb
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  updates:
    runs-on: ubuntu-latest
    if: github.repository == 'CoffeeBrewery/coffee'
    env:
      COFFEEBREWER_DEVELOPER: 1
    steps:
      - name: Setup CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Configure Git user
        uses: CoffeeBrewery/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          username: BrewTestBot

      - name: Set up commit signing
        uses: CoffeeBrewery/actions/setup-commit-signing@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          signing_key: ${{ secrets.BREWTESTBOT_SSH_SIGNING_KEY }}

      - name: Cache Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Update sponsors, maintainers, manpage and completions
        id: update
        run: |
          git fetch origin

          if [[ -n "$GITHUB_REF_NAME" && "$GITHUB_REF_NAME" != "master" && "$GITHUB_REF_NAME" != "main" ]]
          then
            BRANCH="$GITHUB_REF_NAME"
          else
            BRANCH=sponsors-maintainers-man-completions
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "${BRANCH}"
          then
            git checkout --force "${BRANCH}"
            git checkout "README.md" \
                         "docs/Manpage.md" \
                         "manpages/coffee.1" \
                         "completions"
          else
            git checkout --force --no-track -B "${BRANCH}" origin/HEAD
          fi

          if ! coffee update-sponsors
          then
            echo "::warning::coffee update-sponsors failed; README sponsors were not updated."
            echo "sponsors_failed=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet -- README.md
          then
            git add "README.md"
            git commit -m "Update sponsors." \
                       -m "Autogenerated by the [sponsors-maintainers-man-completions](https://github.com/CoffeeBrewery/coffee/blob/HEAD/.github/workflows/sponsors-maintainers-man-completions.yml) workflow."
            COMMITTED=true
          fi

          if coffee update-maintainers
          then
            git add "README.md" \
                    "docs/Manpage.md" \
                    "manpages/coffee.1"
            git commit -m "Update maintainers." \
                       -m "Autogenerated by the [sponsors-maintainers-man-completions](https://github.com/CoffeeBrewery/coffee/blob/HEAD/.github/workflows/sponsors-maintainers-man-completions.yml) workflow."
            COMMITTED=true
          fi

          if coffee generate-man-completions
          then
            git add "README.md" \
                    "docs/Manpage.md" \
                    "manpages/coffee.1" \
                    "completions"
            git commit -m "Update manpage and completions." \
                       -m "Autogenerated by the [sponsors-maintainers-man-completions](https://github.com/CoffeeBrewery/coffee/blob/HEAD/.github/workflows/sponsors-maintainers-man-completions.yml) workflow."
            COMMITTED=true
          fi

          if [[ -n "${COMMITTED-}" ]]
          then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            PULL_REQUEST_STATE="$(gh pr view --json=state | jq -r ".state" || true)"
            if [[ "${PULL_REQUEST_STATE}" != "OPEN" ]]
            then
              echo "pull_request=true" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.COFFEEBREWER_GITHUB_PUBLIC_REPO_TOKEN }}
          COFFEEBREWER_GITHUB_API_TOKEN: ${{ secrets.COFFEEBREWER_BREW_UPDATE_SPONSORS_MAINTAINERS_TOKEN }}
          COFFEEBREWER_PATREON_API_TOKEN: ${{ secrets.COFFEEBREWER_PATREON_API_TOKEN }}
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Push commits
        if: steps.update.outputs.committed == 'true'
        uses: CoffeeBrewery/actions/git-try-push@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.COFFEEBREWER_GITHUB_PUBLIC_REPO_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: ${{ steps.update.outputs.branch }}
          force: true

      - name: Open a pull request
        if: steps.update.outputs.pull_request == 'true'
        run: gh pr create --fill
        env:
          GITHUB_TOKEN: ${{ secrets.COFFEEBREWER_GITHUB_PUBLIC_REPO_TOKEN }}
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Report sponsor update failure
        if: steps.update.outputs.sponsors_failed == 'true'
        run: |
          echo "::error::coffee update-sponsors failed; other updates have been handled."
          exit 1

  issue:
    needs: updates
    if: always() && github.event_name == 'schedule' && github.repository == 'CoffeeBrewery/coffee'
    runs-on: ubuntu-slim
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      # To create or update issues
      issues: write
    steps:
      - name: Open, update, or close sponsors, maintainers, manpage and completions issue
        uses: CoffeeBrewery/actions/create-or-update-issue@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          title: Failed to update sponsors, maintainers, manpage and completions
          body: >
            The sponsors, maintainers, manpage and completions workflow [failed](${{ env.RUN_URL }}). Some updates may have completed; check the workflow log for details.
          labels: bug
          update-existing: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
          close-existing: ${{ needs.updates.result == 'success' }}
          close-from-author: github-actions[bot]
          close-comment: >
            The sponsors, maintainers, manpage and completions workflow [succeeded](${{ env.RUN_URL }}). Closing this issue.
