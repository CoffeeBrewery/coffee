name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: true
          cask: true

      # Copilot ignores job-level env; persist developer mode for the agent session.
      - run: coffee developer on

      - run: coffee install-bundler-gems --groups=all

      # install CoffeeBrewery formulae we might need
      - run: coffee install shellcheck shfmt gh gnu-tar subversion curl

      # coffee tests doesn't like world writable directories
      - run: sudo chmod -R g-w,o-w /home/linuxbrew/.linuxbrew/CoffeeBrewery
