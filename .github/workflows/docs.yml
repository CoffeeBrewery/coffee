name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  pages: read

env:
  COFFEEBREWER_DEVELOPER: 1
  COFFEEBREWER_NO_AUTO_UPDATE: 1
  COFFEEBREWER_NO_ENV_HINTS: 1
  COFFEEBREWER_NO_INSTALL_CLEANUP: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false
          stable: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vale
        run: coffee install vale

      - name: Cleanup CoffeeBrewery/coffee docs
        if: github.repository == 'CoffeeBrewery/coffee'
        run: |
          # No ignore support (https://github.com/errata-ai/vale/issues/131).
          rm -r Library/CoffeeBrewery/vendor

          # Generate latest manpage
          coffee generate-man-completions --no-exit-code

      - name: Run Vale
        run: vale docs/

      - name: Setup Ruby
        uses: CoffeeBrewery/actions/setup-ruby@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          bundler-cache: true
          portable-ruby: true
          working-directory: docs

      - name: Check Markdown syntax
        working-directory: docs
        run: bundle exec rake lint

      - name: Check code blocks conform to our Ruby style guide
        run: coffee style docs

      - name: Generate formulae.coffee.sh API samples
        if: github.repository == 'CoffeeBrewery/formulae.coffee.sh'
        working-directory: docs
        run: ../script/generate-api-samples.rb --template

      - name: Cache HTML Proofer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer

      - name: Build the site
        working-directory: docs
        run: bundle exec rake build

      - name: Check for broken links
        if: github.event_name == 'pull_request'
        working-directory: docs
        run: bundle exec rake test || bundle exec rake test

      - name: Rebuild the site with YARD
        if: github.repository == 'CoffeeBrewery/coffee'
        working-directory: docs
        run: bundle exec rake yard build

      - name: Upload pages artifact
        if: github.repository == 'CoffeeBrewery/coffee'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site/

  deploy:
    needs: docs
    if: ${{ github.repository == 'CoffeeBrewery/coffee' && github.ref_name == 'main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deploy_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-issue:
    name: Open/close deploy issue
    needs: [docs, deploy]
    if: ${{ github.repository == 'CoffeeBrewery/coffee' && always() && github.ref_name == 'main' }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write # for CoffeeBrewery/actions/create-or-update-issue
    steps:
      - name: Open, update, or close deploy issue
        uses: CoffeeBrewery/actions/create-or-update-issue@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          title: docs.coffee.sh deployment failed!
          body: The most recent [docs.coffee.sh deployment failed](${{ env.RUN_URL }}).
          labels: deploy failure
          update-existing: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
          close-existing: ${{ needs.deploy.result == 'success' }}
          close-from-author: github-actions[bot]
          close-comment: The most recent [docs.coffee.sh deployment succeeded](${{ env.RUN_URL }}). Closing issue.
