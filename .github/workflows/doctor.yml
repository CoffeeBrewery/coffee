name: coffee doctor
on:
  pull_request:
    paths:
      - .github/workflows/doctor.yml
      - Library/CoffeeBrewery/cmd/doctor.rb
      - Library/CoffeeBrewery/diagnostic.rb
      - Library/CoffeeBrewery/extend/os/diagnostic.rb
      - Library/CoffeeBrewery/extend/os/mac/diagnostic.rb
      - Library/CoffeeBrewery/os/mac/xcode.rb

permissions:
  contents: read

env:
  COFFEEBREWER_DEVELOPER: 1
  COFFEEBREWER_NO_AUTO_UPDATE: 1

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  determine-runners:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.determine-runners.outputs.runners }}
    steps:
      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Determine runners to use for this job
        id: determine-runners
        env:
          COFFEEBREWER_MACOS_TIMEOUT: 30
        run: coffee determine-test-runners --all-supported

  tests:
    needs: determine-runners
    strategy:
      matrix:
        include: ${{ fromJson(needs.determine-runners.outputs.runners) }}
      fail-fast: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: /tmp
    steps:
      - name: Set up CoffeeBrewery
        id: set-up-homebrew
        uses: CoffeeBrewery/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - run: coffee test-bot --only-cleanup-before
        if: matrix.cleanup

      - run: coffee doctor

      - run: coffee test-bot --only-cleanup-after
        if: always() && matrix.cleanup
